
workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60
    instance_type: linux_x2

    scripts:
      - name: Build Debug APK
        script: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
